# OpenWeather API Configuration
# Prefer setting the API key via environment variable OPENWEATHER_API_KEY in production.
# The value after the colon is a local fallback (remove before making the repo public).
openweather.api.key=${OPENWEATHER_API_KEY:30300fa51c89249d4cf530f21c579d66}
openweather.api.url=https://api.openweathermap.org/data/2.5/weather

# Server Configuration
# Bind to the PORT env var (Render provides PORT). Fallback to 8080 for local dev.
server.port=${PORT:8080}

# Spring Configuration
spring.thymeleaf.cache=false