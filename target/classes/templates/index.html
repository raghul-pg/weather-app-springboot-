<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather • Modern</title>
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
        <link href="/css/app.css" rel="stylesheet">
        <meta name="description" content="Simple modern weather app" />
</head>
<body>
    <main class="app">
        <header class="app-header">
            <div class="brand">
                <h1>Weather</h1>
                <p class="muted">Fast, clean, and modern</p>
            </div>
            <div class="search">
                <input id="city-input" type="search" placeholder="Enter city " aria-label="city" />
                <button id="search-btn" class="btn">Search</button>
            </div>
        </header>

        <section class="container">
            <section id="primary" class="primary-card">
                <!-- Main searched city will be rendered here -->
            </section>

            <section class="defaults">
                <h2>Popular cities</h2>
                <div id="defaults-grid" class="grid"></div>
            </section>
        </section>

        <footer class="footer">
            <small>Data provided by open weather</small>
        </footer>
    </main>

    <script>
        // default cities to show on load
        window.DEFAULT_CITIES = ["London", "New York", "Tokyo", "Sydney", "Mumbai"];
    </script>
    <script src="/js/app.js"></script>
</body>
</html>
